name = "qafqaz-avto-booking"
main = "telegram-proxy.js"
compatibility_date = "2024-01-01"

# TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID are set as secrets, not here:
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_CHAT_ID
#
# Optional plain var — the site origin allowed to call this worker.
# Uncomment and set once the site is live on its real domain:
# [vars]
# ALLOWED_ORIGIN = "https://qafqazavto.az"
